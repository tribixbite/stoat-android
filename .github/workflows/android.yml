name: Build & Release APK

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
    tags-ignore:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      RVX_SENTRY_DSN: ""
      RVX_DEBUG_APP_NAME: "Stoat Debug"
      RVX_BUILD_FLAVOUR_ID: "ci"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Create build properties
        run: |
          cat > stoatbuild.properties << 'EOF'
          sentry.dsn=
          sentry.upload_mappings=false
          build.flavour_id=ci
          build.debug.app_name=Stoat Debug
          EOF

      - name: Create placeholder google-services.json
        run: |
          cat > app/google-services.json << 'EOF'
          {"project_info":{"project_number":"000000000000","project_id":"stoat-ci","storage_bucket":"stoat-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"chat.revolt"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000001","android_client_info":{"package_name":"chat.revolt.debug"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -not -name "*androidTest*" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "app/build/outputs/apk/debug/Stoat-${{ steps.sha.outputs.short }}.apk"
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: "stoat-debug-${{ steps.sha.outputs.short }}"
          path: app/build/outputs/apk/debug/Stoat-*.apk
          retention-days: 30

      - name: Create dev release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/Stoat-*.apk
          tag_name: "dev-${{ steps.sha.outputs.short }}"
          name: "Stoat Dev Build (${{ steps.sha.outputs.short }})"
          prerelease: false
          body: |
            Stoat Android APK — Development Build

            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}

            ## Installation
            1. Download the APK
            2. Enable "Unknown sources" in Android settings
            3. Install and open
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
